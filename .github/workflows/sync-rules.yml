name: Sync Rules

on:
  schedule:
    # 每天 UTC 21:00 自动触发，即北京时间 (UTC+8) 每日早上 05:00
    - cron: '0 21 * * *'
  workflow_dispatch: # 支持在 Actions 界面手动触发
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-rules.js'
      - '.github/workflows/sync-rules.yml'
      
concurrency:
  group: sync-rules
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 借鉴模块同步机制：检出后延时等待 1 分钟，平滑避开 GitHub API 突发速率限制
      - name: 缓冲延时 (等待 1 分钟)
        run: sleep 60

      - name: 执行规则生成脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-rules.js

      - name: 提交并推送最新数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/rules.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(rules): 自动同步 blackmatrix7 规则库 [skip ci]" && git push)
