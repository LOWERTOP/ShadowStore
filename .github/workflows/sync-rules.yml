name: Sync Rules

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动执行一次
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-rules.js'

concurrency:
  group: shadowstore-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run Rules Synchronization Script
        run: node scripts/build-rules.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/rules.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(rules): 自动同步规则与数据 [skip ci]" && git push)
