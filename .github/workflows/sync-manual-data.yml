name: Sync Shadowrocket Manual Data

on:
  schedule:
    # 每天 UTC 03:00 (北京时间 11:00) 定时执行更新
    - cron: '0 3 * * *'
  workflow_dispatch: # 支持手动点击运行

permissions:
  contents: write

jobs:
  sync-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ShadowStore
        uses: actions/checkout@v4

      - name: Fetch README and Build JSON
        run: |
          mkdir -p scripts
          python3 - << 'EOF'
          import urllib.request
          import json
          import datetime

          url = "https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/refs/heads/main/README.md"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  content = response.read().decode('utf-8')
          except Exception as e:
              print(f"Fetch failed: {e}")
              exit(1)

          data = {
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": url,
              "markdown": content
          }

          # 格式化写入 scripts 文件夹
          with open("scripts/shadowrocket_manual.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Successfully generated scripts/shadowrocket_manual.json")
          EOF

      - name: Commit and Push to scripts/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add scripts/shadowrocket_manual.json
          if git diff --staged --quiet; then
            echo "No manual content changes detected."
          else
            git commit -m "chore(auto): 更新 Shadowrocket 手册数据 [skip ci]"
            git push origin HEAD
          fi
