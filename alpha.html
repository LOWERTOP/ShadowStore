        function appendNextBatch() {
            if (state.focusedModuleId) return;
            if (state.currentlyRendered >= state.filteredModules.length) {
                sentinel.style.display = "none";
                checkScrollLock();
                return;
            }
            const fragment = document.createDocumentFragment();
            const nextBatch = state.filteredModules.slice(state.currentlyRendered, state.currentlyRendered + CONFIG.PAGE_SIZE);
            for (let i = 0; i < nextBatch.length; i++) {
                const module = nextBatch[i];
                if (module) fragment.appendChild(createModuleCard(module));
            }
            modulesContainer.appendChild(fragment);
            state.currentlyRendered += nextBatch.length;
            
            sentinel.style.display = state.currentlyRendered >= state.filteredModules.length ? "none" : "block";
            
            scheduleLayoutUpdate();
            updateSearchLayer();
            checkScrollLock();
        }

        function renderFilteredList(list, customLabel = null) {
            if (state.isInitialLoading) {
                sentinel.style.display = "none";
                countText.textContent = "";
                modulesContainer.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">
                            <span class="status-dot loading" style="width: 14px; height: 14px;"></span>
                        </div>
                        正在同步资源，请稍候...
                    </div>
                `;
                scheduleLayoutUpdate();
                checkScrollLock();
                return;
            }

            state.filteredModules = list;
            state.currentlyRendered = 0;
            modulesContainer.innerHTML = "";

            const currentLabel = customLabel || TAB_NAMES[state.activeTab] || TAB_NAMES.more;

            if (!state.filteredModules.length) {
                sentinel.style.display = "none";
                modulesContainer.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="6.5"></circle>
                                <path d="m16 16 4.5 4.5"></path>
                            </svg>
                        </div>
                        没有找到匹配的${escapeHTML(currentLabel)}
                    </div>
                `;
                countText.textContent = `0 个${currentLabel}`;
                scheduleLayoutUpdate();
                checkScrollLock();
                return;
            }

            countText.textContent = `${state.filteredModules.length} 个${currentLabel}`;
            appendNextBatch();
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !state.isInitialLoading && !state.isDataLoading && !state.isListView && !state.focusedModuleId) {
                appendNextBatch();
            }
        }, { rootMargin: "300px" });
        observer.observe(sentinel);

        function filterModules() {
            if (state.isInitialLoading) {
                renderFilteredList([]);
                return;
            }

            const keyword = searchInput.value.trim().normalize("NFKC").toLowerCase();
            document.body.classList.toggle("has-search-text", keyword.length > 0);
            updateStandaloneButtonState();

            let result = [];
            if (keyword) {
                result = state.allModules.filter(m => m._searchText && m._searchText.includes(keyword));
                renderFilteredList(result, TAB_NAMES.more);
            } else {
                result = state.allModules.filter(m => (m.category || "module") === state.activeTab);
                const currentLabel = TAB_NAMES[state.activeTab] || TAB_NAMES.more;
                renderFilteredList(result, currentLabel);
            }
        }

        function switchWithFade(renderCallback) {
            clearTimeout(modulesFadeTimer);
            modulesContainer.classList.add("fade-out");
            modulesFadeTimer = setTimeout(() => {
                renderCallback();
                modulesContainer.classList.remove("fade-out");
            }, 180);
        }

        function switchToTab(targetTab) {
            if (state.isListView) {
                setListViewMode(false);
            }
            searchInput.blur();
            document.body.classList.remove("has-search-focus");
            if (state.activeTab === targetTab && !state.focusedModuleId) {
                updateTabIndicator(true);
                return;
            }

            state.focusedModuleId = null;
            searchInput.value = "";
            document.body.classList.remove("has-search-text");
            updateStandaloneButtonState();

            state.activeTab = targetTab;
            tabItems.forEach(t => {
                const isActive = t.getAttribute("data-tab") === targetTab;
                t.classList.toggle("active", isActive);
                t.setAttribute("aria-selected", isActive ? "true" : "false");
            });

            isTabAnimating = true;
            clearTimeout(tabAnimTimer);
            tabAnimTimer = setTimeout(() => { isTabAnimating = false; }, 460);

            updateTabIndicator(true);

            clearTimeout(tabSwitchContentTimer);
            tabSwitchContentTimer = setTimeout(() => {
                switchWithFade(() => {
                    filterModules();
                    if (window.scrollY > 0) {
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    }
                });
            }, 80);
        }

        tabItems.forEach(tab => {
            tab.addEventListener("click", () => {
                if (isTabDragging) return;
                const targetTab = tab.getAttribute("data-tab");
                switchToTab(targetTab);
            });
        });

        // 窄屏标签栏：精确以手指为中心横向绝对跟随，松手吸附最近标签
        let isTabDragging = false;
        let isDragActive = false;
        let tabTouchStartX = 0;
        let tabTouchStartY = 0;
        let tabItemsGeometry = [];
        let activeSnapTab = null;

        function cacheTabsGeometry() {
            if (!tabBarEl) return;
            const barRect = tabBarEl.getBoundingClientRect();
            tabItemsGeometry = Array.from(tabItems).map(item => {
                const itemRect = item.getBoundingClientRect();
                const left = itemRect.left - barRect.left;
                const width = itemRect.width;
                return {
                    tab: item.getAttribute("data-tab"),
                    left: left,
                    width: width,
                    center: left + width / 2
                };
            });
        }

        function getInterpolatedWidthAtCenter(centerX) {
            if (!tabItemsGeometry.length) return 80;
            const first = tabItemsGeometry[0];
            const last = tabItemsGeometry[tabItemsGeometry.length - 1];

            if (centerX <= first.center) return first.width;
            if (centerX >= last.center) return last.width;

            for (let i = 0; i < tabItemsGeometry.length - 1; i++) {
                const cur = tabItemsGeometry[i];
                const next = tabItemsGeometry[i + 1];
                if (centerX >= cur.center && centerX <= next.center) {
                    const span = next.center - cur.center;
                    const ratio = span > 0 ? (centerX - cur.center) / span : 0;
                    return cur.width + (next.width - cur.width) * ratio;
                }
            }
            return first.width;
        }

        function updateIndicatorDirectly(left, width) {
            tabIndicator.style.transition = 'none';
            tabIndicator.style.width = `${width}px`;
            tabIndicator.style.transform = `translate3d(${left}px, 0, 0)`;
        }

        function handleDragAtClientX(clientX) {
            if (!tabBarEl || !tabItemsGeometry.length) return;
            const barRect = tabBarEl.getBoundingClientRect();
            let pointerX = clientX - barRect.left;

            const firstTab = tabItemsGeometry[0];
            const lastTab = tabItemsGeometry[tabItemsGeometry.length - 1];

            // 橡皮筋阻尼限制滑块中心不超出标签栏两端
            let targetCenter = pointerX;
            if (targetCenter < firstTab.center) {
                targetCenter = firstTab.center - Math.pow(firstTab.center - targetCenter, 0.72) * 2;
            } else if (targetCenter > lastTab.center) {
                targetCenter = lastTab.center + Math.pow(targetCenter - lastTab.center, 0.72) * 2;
            }

            const currentWidth = getInterpolatedWidthAtCenter(targetCenter);
            const targetLeft = targetCenter - (currentWidth / 2);

            updateIndicatorDirectly(targetLeft, currentWidth);

            // 实时查找距滑块中心最近的标签，高亮指示激活状态
            let closest = firstTab;
            let minDiff = Infinity;
            for (let i = 0; i < tabItemsGeometry.length; i++) {
                const diff = Math.abs(tabItemsGeometry[i].center - targetCenter);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = tabItemsGeometry[i];
                }
            }

            if (closest.tab !== activeSnapTab) {
                activeSnapTab = closest.tab;
                tabItems.forEach(t => {
                    t.classList.toggle("active", t.getAttribute("data-tab") === activeSnapTab);
                });
            }
        }

        if (tabBarWrapperEl) {
            tabBarWrapperEl.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                const isSingleCol = controlBarEl && controlBarEl.classList.contains("is-single-column");
                if (!isSingleCol || state.isListView) return;

                cacheTabsGeometry();
                tabTouchStartX = e.touches[0].clientX;
                tabTouchStartY = e.touches[0].clientY;
                isTabDragging = true;
                isDragActive = false;
                activeSnapTab = state.activeTab;
            }, { passive: true });

            tabBarWrapperEl.addEventListener('touchmove', (e) => {
                if (!isTabDragging || e.touches.length !== 1) return;

                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const diffX = currentX - tabTouchStartX;
                const diffY = currentY - tabTouchStartY;

                if (!isDragActive) {
                    if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 7) {
                        isTabDragging = false;
                        return;
                    }
                    if (Math.abs(diffX) > 6) {
                        isDragActive = true;
                        isTabAnimating = true;
                    }
                }

                if (isDragActive) {
                    if (e.cancelable) e.preventDefault();
                    handleDragAtClientX(currentX);
                }
            }, { passive: false });

            const finishDrag = (e) => {
                if (!isTabDragging) return;
                const wasActive = isDragActive;
                isTabDragging = false;
                isDragActive = false;
                isTabAnimating = false;

                if (!wasActive) {
                    return;
                }

                if (e && e.cancelable) e.preventDefault();

                // 松手立即吸附到最近判定的目标标签并激活对应内容
                if (activeSnapTab) {
                    switchToTab(activeSnapTab);
                } else {
                    updateTabIndicator(true);
                }
            };

            tabBarWrapperEl.addEventListener('touchend', finishDrag, { passive: false });
            tabBarWrapperEl.addEventListener('touchcancel', () => {
                if (!isTabDragging) return;
                isTabDragging = false;
                isDragActive = false;
                isTabAnimating = false;
                updateTabIndicator(true);
            }, { passive: true });
        }

        searchInput.addEventListener("input", () => {
            state.focusedModuleId = null;
            document.body.classList.toggle("has-search-text", searchInput.value.length > 0);
        });

        searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                performSearch();
            }
        });

        window.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === "Escape") {
                state.focusedModuleId = null;
                searchInput.value = "";
                searchInput.blur();
                document.body.classList.remove("has-search-text", "has-search-focus");
                setListViewMode(false);
                switchWithFade(() => {
                    filterModules();
                });
                updateStandaloneButtonState();
            }
        });

        function setSearchState(enabled) {
            searchInput.disabled = !enabled;
            const mainP = document.getElementById("mainPlaceholder");
            if (mainP) mainP.textContent = enabled ? "输入后按回车或点击搜索..." : "请在加载完成后执行搜索...";

            if (searchShortcut) {
                searchShortcut.style.opacity = enabled ? "1" : "0.35";
            }

            if (!enabled) {
                searchInput.value = "";
                updateStandaloneButtonState();
            }
        }

        let noticeInterval = null;
        if (noticeTrack && noticeTrack.children.length > 0) {
            const firstItemClone = noticeTrack.children[0].cloneNode(true);
            noticeTrack.appendChild(firstItemClone);

            let noticeIndex = 0;
            const originalCount = noticeTrack.children.length - 1; 
            let isAnimating = false;

            function updateNoticePosition() {
                noticeTrack.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                noticeTrack.style.transform = `translateY(-${noticeIndex * 32}px)`;
            }

            function nextNotice() {
                if (document.activeElement === searchInput || searchInput.value.length > 0 || state.isListView || state.focusedModuleId) return;
                if (isAnimating) return;
                isAnimating = true;
                noticeIndex++;
                updateNoticePosition();

                if (noticeIndex === originalCount) {
                    setTimeout(() => {
                        noticeTrack.style.transition = 'none';
                        noticeIndex = 0;
                        noticeTrack.style.transform = `translateY(0)`;
                        void noticeTrack.offsetHeight;
                        isAnimating = false;
                    }, 450); 
                } else {
                    setTimeout(() => { isAnimating = false; }, 450);
                }
            }

            function startNoticeLoop() {
                if (noticeInterval) clearInterval(noticeInterval);
                noticeInterval = setInterval(nextNotice, 3800);
            }

            function stopNoticeLoop() {
                if (noticeInterval) {
                    clearInterval(noticeInterval);
                    noticeInterval = null;
                }
            }

            startNoticeLoop();

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) stopNoticeLoop();
                else startNoticeLoop();
            });
        }

        function getThemeMode() {
            try {
                const saved = localStorage.getItem("sr_theme_override");
                if (saved === "dark" || saved === "light" || saved === "auto") return saved;
            } catch (e) {}
            return "auto"; 
        }

        function getEffectiveTheme(mode) {
            if (mode === "dark" || mode === "light") return mode;
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        function updateThemeUI() {
            const mode = getThemeMode();
            const currentTheme = getEffectiveTheme(mode);
            document.documentElement.setAttribute("data-theme", currentTheme);
            
            const themeColor = currentTheme === "dark" ? "#14161a" : "#f0f2f5";
            const themeColorMeta = document.querySelector('meta[name="theme-color"]');
            if (themeColorMeta) themeColorMeta.setAttribute("content", themeColor);
            document.documentElement.style.backgroundColor = themeColor;

            if (mode === "light") {
                themeToggleBtn.innerHTML = SUN_ICON;
                themeToggleBtn.setAttribute("title", "当前：浅色主题");
                themeToggleBtn.setAttribute("aria-label", "当前：浅色主题");
            } else if (mode === "dark") {
                themeToggleBtn.innerHTML = MOON_ICON;
                themeToggleBtn.setAttribute("title", "当前：深色主题");
                themeToggleBtn.setAttribute("aria-label", "当前：深色主题");
            } else {
                themeToggleBtn.innerHTML = SYSTEM_ICON;
                themeToggleBtn.setAttribute("title", "当前：自动主题");
                themeToggleBtn.setAttribute("aria-label", "当前：自动主题");
            }
        }

        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
            if (getThemeMode() === "auto") updateThemeUI();
        });

        themeToggleBtn.addEventListener("click", () => {
            const currentMode = getThemeMode();
            const isSystemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            let nextMode, toastText;

            if (currentMode === "auto") {
                nextMode = isSystemDark ? "light" : "dark";
                toastText = isSystemDark ? "已切换为浅色模式" : "已切换为深色模式";
            } else if (currentMode === "light") {
                nextMode = isSystemDark ? "dark" : "auto";
                toastText = isSystemDark ? "已切换为深色模式" : "已切换为自动跟随系统";
            } else { 
                nextMode = isSystemDark ? "auto" : "light";
                toastText = isSystemDark ? "已切换为自动跟随系统" : "已切换为浅色模式";
            }

            try {
                localStorage.setItem("sr_theme_override", nextMode);
            } catch (e) {}
            updateThemeUI();
            showToast(toastText);
        });

        updateThemeUI();

        try {
            const cleanUrl = new URL(window.location.href);
            if (cleanUrl.searchParams.has("_refresh")) {
                cleanUrl.searchParams.delete("_refresh");
                window.history.replaceState({}, document.title, cleanUrl.href);
            }
        } catch (e) {}

        let touchStartX = 0, touchStartY = 0, isPulling = false, isPullLocked = false, pullRafId = null;
        let hasPulledContainer = false;
        const MIN_DRAG_DEADZONE = 20;
        const PULL_TRIGGER_DIFF = 110; 

        async function triggerForceReload() {
            if (state.isPullRefreshing || state.isDataLoading) return;
            state.isPullRefreshing = true;

            ptrIcon.classList.remove("rotate");
            ptrText.textContent = "正在强制刷新本站...";

            clearSiteDataCache();

            const reboundBezier = 'top 0.38s cubic-bezier(0.2, 0.9, 0.3, 1)';
            pageContainer.style.transition = reboundBezier;
            pageContainer.style.top = '0';

            pullRefreshIndicator.style.transition = `${reboundBezier}, opacity 0.25s ease`;
            pullRefreshIndicator.style.opacity = '0';
            pullRefreshIndicator.style.transform = 'translate3d(-50%, -60px, 0)';
            ptrIcon.classList.remove("rotate");
            pageContainer.style.willChange = "auto";
            hasPulledContainer = false;

            const reloadUrl = buildForceReloadUrl();
            setTimeout(() => {
                window.location.replace(reloadUrl);
            }, 180);
        }

        function resetPullState() {
            isPulling = false;
            isPullLocked = false;
            if (pullRafId) cancelAnimationFrame(pullRafId);

            if (hasPulledContainer) {
                const reboundBezier = 'top 0.38s cubic-bezier(0.2, 0.9, 0.3, 1)';
                pageContainer.style.transition = reboundBezier;
                pageContainer.style.top = '0';
                pullRefreshIndicator.style.transition = `${reboundBezier}, opacity 0.25s ease`;
                pullRefreshIndicator.style.opacity = '0';
                pullRefreshIndicator.style.transform = 'translate3d(-50%, -60px, 0)';
            } else {
                pageContainer.style.transition = 'none';
                pageContainer.style.top = '0';
                pullRefreshIndicator.style.transition = 'none';
                pullRefreshIndicator.style.opacity = '0';
            }
            
            ptrIcon.classList.remove("rotate");
            pageContainer.style.willChange = "auto";
            hasPulledContainer = false;
        }

        window.addEventListener('touchstart', (e) => {
            if (state.isListView || state.isPullRefreshing || state.isDataLoading) {
                isPulling = false;
                return;
            }
            if (e.target.closest('input, button, a, textarea, select, label, [contenteditable="true"], .alphabet-view-container, .alphabet-fast-index, .tab-bar-wrapper')) {
                isPulling = false;
                return;
            }
            const isAtTop = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
            if (isAtTop) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isPulling = true;
                isPullLocked = false;
                hasPulledContainer = false;
            } else {
                isPulling = false;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (state.isListView || !isPulling || state.isPullRefreshing || state.isDataLoading) {
                return;
            }

            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const diffX = currentX - touchStartX;
            const diffY = currentY - touchStartY;

            if (!isPullLocked) {
                if (Math.abs(diffX) > Math.abs(diffY) || diffY <= 0) {
                    isPulling = false;
                    isPullLocked = true;
                    return;
                }

                if (diffY > MIN_DRAG_DEADZONE) {
                    isPullLocked = true;
                    pageContainer.style.willChange = "top";
                    pageContainer.style.transition = 'none';
                    pullRefreshIndicator.style.transition = 'none';
                }
            }

            if (isPullLocked && diffY > MIN_DRAG_DEADZONE) {
                hasPulledContainer = true;
                const effectiveDiff = diffY - MIN_DRAG_DEADZONE;
                const containerShift = Math.min(Math.pow(effectiveDiff, 0.65) * 1.3, 48);
                const indicatorShift = Math.min(containerShift * 0.42, 18);
                const progress = Math.min(effectiveDiff / (PULL_TRIGGER_DIFF - MIN_DRAG_DEADZONE), 1);

                if (pullRafId) cancelAnimationFrame(pullRafId);
                pullRafId = requestAnimationFrame(() => {
                    pageContainer.style.top = `${containerShift}px`;
                    pullRefreshIndicator.style.opacity = Math.min(progress * 1.2, 1);
                    pullRefreshIndicator.style.transform = `translate3d(-50%, ${indicatorShift}px, 0)`;

                    if (diffY >= PULL_TRIGGER_DIFF) {
                        ptrIcon.classList.add("rotate");
                        ptrText.textContent = "松开将立即强制刷新本站";
                    } else {
                        ptrIcon.classList.remove("rotate");
                        ptrText.textContent = "继续下拉将强制刷新本站";
                    }
                });

                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (state.isListView || !isPulling || state.isPullRefreshing || state.isDataLoading) {
                isPulling = false;
                return;
            }
            isPulling = false;
            isPullLocked = false;
            if (pullRafId) cancelAnimationFrame(pullRafId);

            const currentY = e.changedTouches[0].clientY;
            const diffY = currentY - touchStartY;
            const isAtTop = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;

            if (hasPulledContainer && diffY >= PULL_TRIGGER_DIFF && isAtTop) {
                pageContainer.style.transition = 'top 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)';
                pageContainer.style.top = '38px';
                
                pullRefreshIndicator.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.25s ease';
                pullRefreshIndicator.style.transform = `translate3d(-50%, 16px, 0)`;
                pullRefreshIndicator.style.opacity = '1';
                
                triggerForceReload();
            } else {
                resetPullState();
            }
        }, { passive: true });

        window.addEventListener('touchcancel', resetPullState, { passive: true });

        function cleanOldCaches() {
            try {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith("sr_modules_data_") && key !== CONFIG.CACHE_KEY) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
            } catch (e) {}
        }

        function updateAllModules(list) {
            state.allModules = list;
            moduleDataMap.clear();
            list.forEach(item => {
                moduleDataMap.set(item.id, item);
            });
        }

        async function loadModules(forceRefresh = false) {
            state.isDataLoading = true;
            let cachedData = null;
            const staticItems = normalizeStaticResources();

            try {
                cachedData = localStorage.getItem(CONFIG.CACHE_KEY);
            } catch (e) {}

            let hasRenderedCache = false;

            if (!forceRefresh && cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        state.rawNetworkData = parsed;
                        const normalized = normalizeModules(parsed);
                        if (normalized.length > 0) {
                            updateAllModules([...staticItems, ...normalized]);
                            state.isAlphabetRendered = false;
                            state.isInitialLoading = false;
                            state.isDataLoading = false;
                            filterModules();
                            setSearchState(true);
                            hasRenderedCache = true;

                            state.statusKey = "ready";
                            statusText.textContent = "已就绪";
                            statusDot.className = "status-dot";
                            return true;
                        }
                    }
                } catch (e) {
                    hasRenderedCache = false;
                }
            }

            if (!hasRenderedCache && state.allModules.length === 0) {
                state.statusKey = "fetchingStatic";
                statusText.textContent = "正在拉取最新静态资源索引...";
                statusDot.className = "status-dot loading";
            }

            try {
                const fetchUrl = forceRefresh ? `${CONFIG.DATA_JSON_URL}?_t=${Date.now()}` : CONFIG.DATA_JSON_URL;
                const response = await fetch(fetchUrl, { cache: forceRefresh ? "no-store" : "default" });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (!Array.isArray(data) || !data.length) throw new Error("资源列表为空");

                state.rawNetworkData = data;
                const normalized = normalizeModules(data);
                if (!normalized.length) throw new Error("未解析到有效资源数据");

                updateAllModules([...staticItems, ...normalized]);
                state.isAlphabetRendered = false;
                state.isInitialLoading = false;
                state.isDataLoading = false;
                
                filterModules();
                setSearchState(true);

                try {
                    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify(data));
                } catch (e) {}

                state.statusKey = "synced";
                statusText.textContent = "已同步最新数据";
                statusDot.className = "status-dot";
                return true;
            } catch (error) {
                console.error("加载 modules.json 失败:", error);
                state.isInitialLoading = false; 
                
                if (hasRenderedCache || state.allModules.length > staticItems.length) {
                    state.statusKey = "errorCache";
                    statusText.textContent = "在线同步异常，当前展示缓存数据";
                    statusDot.className = "status-dot error";
                } else {
                    updateAllModules(staticItems);
                    filterModules();
                    setSearchState(true);
                    state.statusKey = "errorStatic";
                    statusText.textContent = "在线资源同步失败，已展示核心入口";
                    statusDot.className = "status-dot error";
                }
                return false;
            } finally {
                state.isDataLoading = false;
                checkScrollLock();
            }
        }

        updateAllModules(normalizeStaticResources());
        filterModules();
        scheduleLayoutUpdate();
        updateTabIndicator(false);
        updateSearchLayer();
        cleanOldCaches();
        loadModules();
    </script>
</body>
</html>
